<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Tarot Launch</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0d12;
    }
    body {
      min-width: 320px;
      color: #e6e1e9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
                   "Microsoft YaHei", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .tarot-v2 {
      position: fixed;
      inset: 0;
      overflow: hidden;
      color: #e6e1e9;
      background: #0b0d12;
      isolation: isolate;
      cursor: default;
    }
    .tarot-v2 .tarot-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image: url("assets/tarot-launch-bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .tarot-v2 .tarot-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, rgba(82,74,91,.05), transparent 30%),
        linear-gradient(180deg, rgba(6,7,10,.04), rgba(6,7,10,.14) 58%, rgba(6,7,10,.30));
    }
    .tarot-v2 .tarot-stage {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      width: 240px;
      height: 390px;
      transform: translate(-50%, -50%);
      perspective: 1200px;
    }
    .tarot-v2 .tarot-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(63vw, 225px);
      aspect-ratio: .617;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      transition:
        transform 980ms cubic-bezier(.2,.8,.2,1),
        opacity 640ms ease,
        filter 640ms ease;
      cursor: pointer;
      animation: tarotCardAppear 900ms ease both;
      outline: none;
      will-change: transform, opacity, filter;
    }
    .tarot-v2 .tarot-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 10px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 18px 45px rgba(0,0,0,.52);
    }
    .tarot-v2 .tarot-card .tarot-front {
      background-image: url("assets/tarot-card-front.jpg");
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }
    .tarot-v2 .tarot-card .tarot-back {
      transform: rotateY(180deg);
      background-image: url("assets/tarot-card-back.jpg");
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }
    .tarot-v2 .tarot-card.tarot-flipped {
      transform: translate(-50%, -50%) rotateY(180deg);
    }
    .tarot-v2 .tarot-card.tarot-sink {
      animation: tarotCardSink 640ms ease forwards;
      pointer-events: none;
    }
    .tarot-v2 .tarot-tip {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: max(42px, calc(env(safe-area-inset-bottom) + 24px));
      transform: translateX(-50%);
      margin: 0;
      color: rgba(222,216,224,.62);
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .14em;
      white-space: nowrap;
      opacity: 1;
      transition: opacity .35s ease;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .tarot-v2 .tarot-tip.tarot-hide { opacity: 0; }
    @keyframes tarotCardAppear {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.90); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes tarotCardSink {
      to { opacity: 0; transform: translate(-50%, -50%) translateY(26px) scale(.90) rotateY(180deg); }
    }
    @media (min-width: 700px) {
      .tarot-v2 .tarot-layer {
        background-image: url("assets/tarot-launch-bg-1206x2622.jpg");
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .tarot-v2 .tarot-card { animation-duration: .01ms; transition-duration: .01ms; }
      .tarot-v2 .tarot-card.tarot-sink { animation-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="tarot-v2" id="tarotLaunch" aria-label="塔罗翻牌启动动画">
    <div class="tarot-layer" aria-hidden="true"></div>
    <div class="tarot-vignette" aria-hidden="true"></div>
    <div class="tarot-stage">
      <div class="tarot-card" id="tarotCard" role="button" tabindex="0" aria-label="翻开塔罗牌">
        <div class="tarot-face tarot-front"></div>
        <div class="tarot-face tarot-back"></div>
      </div>
    </div>
    <p class="tarot-tip" id="tarotTip">轻触翻开</p>
  </main>
  <script>
    (function () {
      "use strict";
      const wrap = document.getElementById("tarotLaunch");
      const card = document.getElementById("tarotCard");
      const tip = document.getElementById("tarotTip");
      let busy = false;
      let finished = false;
      function playTarotReveal() {
        if (busy || finished) return;
        busy = true;
        tip.classList.add("tarot-hide");
        card.classList.add("tarot-flipped");
        window.setTimeout(function () { card.classList.add("tarot-sink"); }, 1150);
        window.setTimeout(function () {
          finished = true;
          busy = false;
          window.dispatchEvent(new CustomEvent("tarotRevealComplete"));
        }, 1830);
      }
      function resetTarotReveal() {
        if (!finished) return;
        card.classList.remove("tarot-flipped", "tarot-sink");
        tip.classList.remove("tarot-hide");
        card.style.animation = "none";
        void card.offsetWidth;
        card.style.animation = "";
        finished = false;
        busy = false;
      }
      card.addEventListener("click", function (event) {
        event.stopPropagation();
        playTarotReveal();
      });
      card.addEventListener("keydown", function (event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        playTarotReveal();
      });
      wrap.addEventListener("click", function () {
        if (finished) resetTarotReveal();
      });
      window.playTarotReveal = playTarotReveal;
      window.resetTarotReveal = resetTarotReveal;
    })();
  </script>
</body>
</html>
