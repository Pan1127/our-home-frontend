<!doctype html>
<html lang="zh-CN" data-launch-mode="tarot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Tarot Launch</title>
<style>
:root{
  --tarot-launch-preview:url("assets/tarot-launch-bg.jpg");
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;color:#e6e1e9}
body{font-family:"SF Pro Text","PingFang SC","Microsoft YaHei",Inter,system-ui,sans-serif}
.launch-screen{
  position:fixed;z-index:120;inset:0;display:grid;place-items:center;overflow:hidden;
  padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));
  color:#e6e1e9;
  background:var(--tarot-launch-preview) center/cover no-repeat #0b0d12;
  isolation:isolate;cursor:pointer;
}
.launch-screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,8,12,.14),rgba(7,8,12,.06) 42%,rgba(7,8,12,.18));
}
.launch-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center}
.tarot-launch{
  position:relative;width:290px;height:236px;display:block;
  perspective:900px;transform-style:preserve-3d;
}
.tarot-card{
  position:absolute;top:50%;left:50%;width:86px;height:142px;
  margin-left:-43px;margin-top:-71px;transform-style:preserve-3d;will-change:transform;
}
.tarot-card.outer-left{animation:tarot-shuffle-a 3.15s cubic-bezier(.4,.02,.2,1) both}
.tarot-card.left{animation:tarot-shuffle-b 3.15s cubic-bezier(.4,.02,.2,1) both}
.tarot-card.center{z-index:3;animation:tarot-draw-center 4.8s cubic-bezier(.32,.04,.18,1) both}
.tarot-card.right{animation:tarot-shuffle-d 3.15s cubic-bezier(.4,.02,.2,1) both}
.tarot-card.outer-right{animation:tarot-shuffle-e 3.15s cubic-bezier(.4,.02,.2,1) both}
.tarot-card-inner{
  position:absolute;inset:0;border-radius:8px;transform-style:preserve-3d;will-change:transform;
}
.tarot-card.center .tarot-card-inner{
  animation:tarot-reveal 4.8s cubic-bezier(.42,.02,.18,1) both;
}
.tarot-face{
  position:absolute;inset:0;overflow:hidden;border:1px solid rgba(228,221,232,.26);
  border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 18px 42px rgba(0,0,0,.38);
}
.tarot-back{
  background:#171820 url("assets/tarot-card-back.jpg") center/cover no-repeat;
}
.tarot-front{
  display:block;padding:0;background:#171820 url("assets/tarot-card-front.jpg") center/cover no-repeat;
  transform:rotateY(180deg);
}
.tarot-back::before,.tarot-back::after{display:none}
.launch-kicker,.launch-title,.launch-subtitle,.launch-day-ribbon{
  animation:tarot-caption 4.8s ease both;
  visibility:hidden;
}
.launch-kicker{
  margin:4px 0 9px;color:#aaa3ae;font-size:.58rem;letter-spacing:.28em;text-transform:uppercase
}
.launch-title{
  margin:0;color:#ece8ef;font-family:Georgia,"Times New Roman",serif;font-size:2rem;font-weight:400;
  line-height:1;letter-spacing:.015em;text-shadow:0 8px 28px rgba(0,0,0,.25)
}
.launch-title span:first-child{font-style:italic}
.launch-subtitle{
  margin:15px 0 0;color:#aaa3ae;font-size:.67rem;letter-spacing:.08em
}
.launch-day-ribbon{
  margin:10px 0 0;color:#8f8994;font-size:.54rem;letter-spacing:.18em
}
@keyframes tarot-shuffle-a{
  0%{transform:translate3d(-74px,22px,-20px) rotate(-17deg)}
  16%{transform:translate3d(52px,-17px,24px) rotate(13deg)}
  33%{transform:translate3d(-18px,28px,-34px) rotate(-5deg)}
  49%{transform:translate3d(78px,12px,12px) rotate(18deg)}
  66%,100%{transform:translate3d(-78px,20px,-14px) rotate(-16deg)}
}
@keyframes tarot-shuffle-b{
  0%{transform:translate3d(-38px,5px,4px) rotate(-8deg)}
  15%{transform:translate3d(76px,24px,-18px) rotate(19deg)}
  31%{transform:translate3d(-68px,-20px,28px) rotate(-18deg)}
  50%{transform:translate3d(20px,30px,-26px) rotate(6deg)}
  66%,100%{transform:translate3d(-39px,6px,2px) rotate(-8deg)}
}
@keyframes tarot-shuffle-d{
  0%{transform:translate3d(38px,5px,4px) rotate(8deg)}
  17%{transform:translate3d(-72px,24px,-22px) rotate(-18deg)}
  34%{transform:translate3d(58px,-23px,30px) rotate(16deg)}
  51%{transform:translate3d(-24px,28px,-24px) rotate(-7deg)}
  66%,100%{transform:translate3d(39px,6px,2px) rotate(8deg)}
}
@keyframes tarot-shuffle-e{
  0%{transform:translate3d(74px,22px,-20px) rotate(17deg)}
  14%{transform:translate3d(-48px,-19px,26px) rotate(-13deg)}
  32%{transform:translate3d(22px,30px,-32px) rotate(6deg)}
  48%{transform:translate3d(-80px,10px,14px) rotate(-19deg)}
  66%,100%{transform:translate3d(78px,20px,-14px) rotate(16deg)}
}
@keyframes tarot-draw-center{
  0%{transform:translate3d(0,-13px,16px) rotate(0) scale(1)}
  10%{transform:translate3d(-78px,16px,-12px) rotate(-19deg) scale(1)}
  22%{transform:translate3d(63px,-21px,32px) rotate(17deg) scale(1)}
  34%{transform:translate3d(-28px,31px,-28px) rotate(-8deg) scale(1)}
  46%{transform:translate3d(0,-8px,28px) rotate(0) scale(1)}
  56%{transform:translate3d(0,-12px,38px) rotate(0) scale(1)}
  68%,100%{transform:translate3d(0,-42px,74px) rotate(0) scale(1.15)}
}
@keyframes tarot-reveal{
  0%,68%{transform:rotateY(0)}
  78%{transform:rotateY(180deg)}
  88%{transform:rotateY(360deg)}
  98%,100%{transform:rotateY(540deg)}
}
@keyframes tarot-caption{
  0%,18%{opacity:0;transform:translateY(5px)}
  29%,76%{opacity:.9;transform:translateY(0)}
  88%,100%{opacity:.58;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
  .tarot-card,.tarot-card-inner,.launch-kicker,.launch-title,.launch-subtitle,.launch-day-ribbon{animation-duration:.001ms!important}
}
</style>
</head>
<body>
<main class="launch-screen" id="launchScreen" aria-label="轻触重播">
  <div class="launch-content" id="launchContent">
    <div class="tarot-launch" aria-hidden="true">
      <div class="tarot-card outer-left"><div class="tarot-card-inner"><div class="tarot-face tarot-back"></div></div></div>
      <div class="tarot-card left"><div class="tarot-card-inner"><div class="tarot-face tarot-back"></div></div></div>
      <div class="tarot-card center"><div class="tarot-card-inner"><div class="tarot-face tarot-back"></div><div class="tarot-face tarot-front"></div></div></div>
      <div class="tarot-card right"><div class="tarot-card-inner"><div class="tarot-face tarot-back"></div></div></div>
      <div class="tarot-card outer-right"><div class="tarot-card-inner"><div class="tarot-face tarot-back"></div></div></div>
    </div>
    <p class="launch-kicker">private room</p>
    <h1 class="launch-title"><span>Welcome</span> <span>home</span></h1>
    <p class="launch-subtitle">正在回到这里…</p>
    <p class="launch-day-ribbon">TOGETHER</p>
  </div>
</main>
<script>
const screen=document.getElementById("launchScreen");
screen.addEventListener("click",()=>{
  const old=document.getElementById("launchContent");
  const fresh=old.cloneNode(true);
  old.replaceWith(fresh);
});
</script>
</body>
</html>
