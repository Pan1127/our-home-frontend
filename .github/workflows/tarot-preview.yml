name: Render Tarot share preview

on:
  push:
    branches: [main]
    paths:
      - 'tarot-share/index.html'
      - 'tarot-share/assets/**'
      - '.github/workflows/tarot-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render smoother animation frames
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not found on runner' >&2
            exit 1
          fi
          rm -rf /tmp/tarot-frames
          mkdir -p /tmp/tarot-frames
          i=0
          for ms in $(seq 0 60 5220); do
            printf -v n '%03d' "$i"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --allow-file-access-from-files \
              --window-size=390,844 \
              --virtual-time-budget="$ms" \
              --screenshot="/tmp/tarot-frames/frame-${n}.png" \
              "file://${GITHUB_WORKSPACE}/tarot-share/index.html"
            i=$((i+1))
          done

      - name: Build smoother animated GIF
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y \
            -framerate 16.6667 \
            -i /tmp/tarot-frames/frame-%03d.png \
            -vf "scale=330:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=192[p];[s1][p]paletteuse=dither=bayer:bayer_scale=2" \
            -loop 0 \
            tarot-share/preview.gif

      - name: Commit preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarot-share/preview.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Render smoother Tarot share preview'
          git push
