name: Render Tarot share preview

on:
  push:
    branches: [main]
    paths:
      - 'tarot-share/index.html'
      - 'tarot-share/assets/**'
      - '.github/workflows/tarot-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture smooth browser preview
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not found on runner' >&2
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool ffmpeg

          export DISPLAY=:99
          Xvfb :99 -screen 0 390x844x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill ${CHROME_PID:-0} ${XVFB_PID:-0} 2>/dev/null || true' EXIT
          sleep 0.5

          "$CHROME" \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --kiosk \
            --window-position=0,0 \
            --window-size=390,844 \
            --allow-file-access-from-files \
            "file://${GITHUB_WORKSPACE}/tarot-share/index.html" \
            >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!

          sleep 2
          xdotool key ctrl+r || true
          sleep 0.08

          ffmpeg -y \
            -f x11grab \
            -framerate 30 \
            -video_size 390x844 \
            -i :99.0 \
            -t 5.4 \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            /tmp/tarot-preview.mp4

          ffmpeg -y \
            -i /tmp/tarot-preview.mp4 \
            -vf "fps=15,scale=330:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=192[p];[s1][p]paletteuse=dither=bayer:bayer_scale=2" \
            -loop 0 \
            tarot-share/preview.gif

      - name: Commit preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarot-share/preview.gif
          git commit -m 'Render clean Tarot share preview'
          git pull --rebase origin main
          git push
