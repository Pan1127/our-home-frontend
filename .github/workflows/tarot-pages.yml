name: Prepare and deploy Tarot share

on:
  push:
    branches: [main]
    paths:
      - 'tarot-share/**'
      - '.github/workflows/tarot-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tarot-pages
  cancel-in-progress: true

jobs:
  prepare-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Snapshot current Tarot assets into the public repo
        run: |
          set -euo pipefail
          mkdir -p tarot-share/assets
          base='https://t3tpao.xyz/home/assets'
          for f in \
            tarot-launch-bg.jpg \
            tarot-launch-bg-1206x2622.jpg \
            tarot-card-front.jpg \
            tarot-card-back.jpg
          do
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 \
              "$base/$f" -o "tarot-share/assets/$f"
          done

          python - <<'PY'
          from pathlib import Path
          p = Path('tarot-share/index.html')
          s = p.read_text(encoding='utf-8')
          for name in [
              'tarot-launch-bg.jpg',
              'tarot-launch-bg-1206x2622.jpg',
              'tarot-card-front.jpg',
              'tarot-card-back.jpg',
          ]:
              s = s.replace(
                  f'https://t3tpao.xyz/home/assets/{name}',
                  f'assets/{name}'
              )
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarot-share/index.html tarot-share/assets
          if ! git diff --cached --quiet; then
            git commit -m 'Snapshot Tarot assets for standalone sharing'
            git push origin HEAD:main
          fi

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)
          if [ "$code" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages is not enabled yet; assets are still snapshotted and ready.'
          fi

      - name: Build Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a tarot-share _site/tarot-share
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Tarot Launch</title>
          <meta http-equiv="refresh" content="0; url=./tarot-share/">
          <script>location.replace('./tarot-share/');</script>
          <a href="./tarot-share/">Open Tarot Launch</a>
          HTML
          touch _site/.nojekyll

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
